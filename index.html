(${d+1})" ${d===37?'disabled':''}>Sonraki ›</button></div><h2>Çalışılacak konular</h2><div class="card">${plan[d].map((x,j)=>`<label class="task"><input type="checkbox" ${done[d+'-'+j]?'checked':''} onchange="toggle(${d},${j},this.checked)"><span class="${done[d+'-'+j]?'checked':''}">${x}</span>${N[x]?`<button class="nb" onclick="event.preventDefault();openNote('${x.replace(/'/g,"\\'")}')">Not</button>`:''}</label>`).join('')}</div><button class="primary" onclick="plan[d].forEach((_,j)=>done[d+'-'+j]=${count(d)!==plan[d].length});save();render()">${count(d)===plan[d].length?'İşaretleri kaldır':'Tümünü tamamla'}</button>`}else if(tab===1){let first=new Date(Date.UTC(year,month,1)),offset=(first.getUTCDay()+6)%7,daysM=new Date(Date.UTC(year,month+1,0)).getUTCDate();html=`<h1>Takvim</h1><div class="card"><div class="row"><button onclick="shift(-1)">‹</button><strong>${first.toLocaleDateString('tr-TR',{month:'long',year:'numeric',timeZone:'UTC'})}</strong><button onclick="shift(1)">›</button></div><br><div class="calendar">${['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(x=>`<small>${x}</small>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:daysM},(_,j)=>{let i=(Date.UTC(year,month,j+1)-start)/86400000;return `<button ${i<0||i>37?'disabled':`onclick="choose(${i})" class="${count(i)===plan[i].length?'complete':''} ${i===today?'selected':''}"`}>${j+1}</button>`}).join('')}</div></div><small>Pembe: tamamlanan gün · Çerçeve: bugün</small>`}else if(tab===2){html=notesView()}else if(tab===3){html=`<h1>İlerlemem</h1><div class="card hero">${ring(n,total)}<div><small>Genel ilerleme</small><div class="big">${n}/${total}</div><small>Tamamlanan konu</small></div></div><div class="stats"><div class="card"><small>Bitirilen gün</small><div class="big">${days}/38</div></div><div class="card"><small>Kalan konu</small><div class="big">${total-n}</div></div></div><h2>Haftalık ilerleme</h2><div class="card">${Array.from({length:6},(_,w)=>{let xs=plan.slice(w*7,w*7+7),a= ="Konu ara…" value="${esc(q)}" oninput="q=this.value;const p=this.selectionStart;render();const e=document.querySelector('.search');e.focus();e.setSelectionRange(p,p)">`;plan.forEach((xs,i)=>{const it=xs.filter(x=>!ql||x.toLocaleLowerCase('tr').includes(ql));if(!it.length)return;h+=`<h2 class="dh">${fmt(i)} · ${i+1}. gün</h2><div class="card">${it.map(x=>N[x]?`<button class="nrow" onclick="openNote('${x.replace(/'/g,"\\'")}')"><span>${x}</span><b>›</b></button>`:`<div class="nrow off"><span>${x}</span><small>yakında</small></div>`).join('')}</div>`});return h}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(done)],{type:'application/json'}));a.download='supanter-yedek.json';a.click()}async function restore(f){if(!f)return;try{let x=JSON.parse(await f.text());if(!x||typeof x!=='object'||Array.isArray(x))throw 0;done=Object.fromEntries(Object.entries(x).filter(([k,v])=>/^\d+-\d+$/.test(k)&&typeof v==='boolean'));save();render()}catch(e){alert('Geçersiz yedek')}}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script><script>document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});</script><script>{const Q=["Simge, hayallerine bir gün daha yakınsın!", "Bugün attığın her adım, yarınki öğretmen Simge'yi büyütüyor.", "Küçük adımlar, büyük hayaller. Hadi Simge!", "Simge, bugün de kendine verdiğin sözü tut!", "Zor günler geçer, emeğin kalır. Devam Simge!", "Sen yapabilirsin Simge, hem de en güzelinden!", "Bir konu daha bitir, bir adım daha yaklaş.", "Simge, disiplin bugün; başarı yarın!", "Her işaretlenen konu, hayaline atılan bir imza.", "Bugünün emeği, yarının gururu olacak Simge!", "Yorulunca dinlen, ama asla bırakma Simge.", "Simge, o atama listesinde adını görmeye az kaldı!", "Bugün de kendini şaşırt Simge!", "Hayallerin seni bekliyor, çalışma masan da!", "Simge, sen bu işin hakkını verirsin!", "Yavaş ilerlemek de ilerlemektir. Devam!", "Bugün bir sayfa, yarın bir kitap. Hadi Simge!", "Simge, gelecekteki öğrencilerin seni bekliyor!"];let last=-1;try{last=+localStorage.getItem('supanter.q')}catch(e){}let i=Math.floor(Math.random()*Q.length);if(Q.length>1&&i===last)i=(i+1)%Q.length;try{localStorage.setItem('supanter.q',i)}catch(e){}document.getElementById('quote').textContent=Q[i]}function closeIntro(){const a=document.getElementById('intro');if(!a)return;a.style.opacity='0';setTimeout(()=>a.remove(),400)}setTimeout(closeIntro,5000);</script></body></html>
