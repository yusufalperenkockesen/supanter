const start=Date.UTC(2026,10,25),date=i=>new Date(start+i*86400000),fmt=i=>date(i).toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long',timeZone:'UTC'});const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),p=Object.fromEntries(parts.map(x=>[x.type,x.value])),today=Math.round((Date.UTC(+p.year,+p.month-1,+p.day)-start)/86400000); let d=Math.max(0,Math.min(37,today)),tab=0,month=date(d).getUTCMonth(),year=date(d).getUTCFullYear(),done={'0-0':true},theme='dark';try{done=JSON.parse(localStorage.getItem('rota.done')||'null')||done;theme=localStorage.getItem('rota.theme')||theme}catch(e){}const save=()=>{try{localStorage.setItem('rota.done',JSON.stringify(done));localStorage.setItem('rota.theme',theme)}catch(e){alert('Bu tarayıcıda kayıt yapılamadı.')}};const count=i=>plan[i].filter((_,j)=>done[i+'-'+j]).length,total=plan.flat().length,percent=(a,b)=>Math.round(a/b*100),ring=(a,b)=>`<div class="ring" style="--p:${percent(a,b)}%"><div>%${percent(a,b)}</div></div>`;function go(t){tab=t;if(t===0)d=Math.max(0,Math.min(37,today));render()}function choose(i){d=i;tab=0;render()}function toggle(i,j,v){done[i+'-'+j]=v;save();render()}function shift(n){let x=new Date(Date.UTC(year,month+n,1));year=x.getUTCFullYear();month=x.getUTCMonth();render()}function render(){document.body.classList.toggle('light',theme==='light');const n=plan.reduce((a,_,i)=>a+count(i),0),days=plan.filter((x,i)=>count(i)===x.length).length;let html='';if(tab===0){html=`<small>${fmt(d)} · ${d+1}. gün</small><h1>${d===today?'Bugünün dersleri':'Ders programı'}</h1><div class="card hero">${ring(count(d),plan[d].length)}<div><small>Günlük ilerleme</small><div class="big">${count(d)}/${plan[d].length}</div><small>${count(d)===plan[d].length?'Tüm konular tamam!':'Konu tamamlandı'}</small></div></div><div class="row"><button onclick="choose(${d-1})" ${d===0?'disabled':''}>‹ Önceki</button><button onclick="choose(${d+1})" ${d===37?'disabled':''}>Sonraki ›</button></div><h2>Çalışılacak konular</h2><div class="card">${plan[d].map((x,j)=>`<label class="task"><input type="checkbox" ${done[d+'-'+j]?'checked':''} onchange="toggle(${d},${j},this.checked)"><span class="${done[d+'-'+j]?'checked':''}">${x}</span></label>`).join('')}</div><button class="primary" onclick="plan[d].forEach((_,j)=>done[d+'-'+j]=${count(d)!==plan[d].length});save();render()">${count(d)===plan[d].length?'İşaretleri kaldır':'Tümünü tamamla'}</button>`}else if(tab===1){let first=new Date(Date.UTC(year,month,1)),offset=(first.getUTCDay()+6)%7,daysM=new Date(Date.UTC(year,month+1,0)).getUTCDate();html=`<h1>Takvim</h1><div class="card"><div class="row"><button onclick="shift(-1)">‹</button><strong>${first.toLocaleDateString('tr-TR',{month:'long',year:'numeric',timeZone:'UTC'})}</strong><button onclick="shift(1)">›</button></div><br><div class="calendar">${['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(x=>`<small>${x}</small>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:daysM},(_,j)=>{let i=(Date.UTC(year,month,j+1)-start)/86400000;return `<button ${i<0||i>37?'disabled':`onclick="choose(${i})" class="${count(i)===plan[i].length?'complete':''} ${i===today?'selected':''}"`}>${j+1}</button>`}).join('')}</div></div><small>Pembe: tamamlanan gün · Çerçeve: bugün</small>`}else if(tab===2){html=`<h1>İlerlemem</h1><div class="card hero">${ring(n,total)}<div><small>Genel ilerleme</small><div class="big">${n}/${total}</div><small>Tamamlanan konu</small></div></div><div class="stats"><div class="card"><small>Bitirilen gün</small><div class="big">${days}/38</div></div><div class="card"><small>Kalan konu</small><div class="big">${total-n}</div></div></div><h2>Haftalık ilerleme</h2><div class="card">${Array.from({length:6},(_,w)=>{let xs=plan.slice(w*7,w*7+7),a=xs.reduce((s,_,i)=>s+count(w*7+i),0),b=xs.flat().length;return `<div class="row"><small>${w+1}. hafta</small><small>${a}/${b}</small></div><div cl
